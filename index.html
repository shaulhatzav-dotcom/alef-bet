<meta charset="utf-8">
<title>אלף בית ביער</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<script>document.documentElement.lang='he'; document.documentElement.dir='rtl';</script>
<!-- No html/head/body tags: the Artifact publisher wraps the page; browsers add them locally. Single dark look on purpose (night forest). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Varela+Round&family=Gveret+Levin&display=swap" rel="stylesheet">
<style>
  :root{ --gold:#ffd23f; --ink:#2b2140; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none}
  html,body{margin:0; height:100%; overflow:hidden; background:#0d1a2b; font-family:'Varela Round',sans-serif; color:var(--ink); touch-action:manipulation}
  #game{position:fixed; inset:0; overflow:hidden; background:#0d1a2b}

  /* ---------- scene ---------- */
  #stage{position:absolute; inset:0; overflow:hidden}
  #scene{position:absolute; left:0; top:0; background-size:100% 100%; will-change:transform}
  #fade{position:absolute; inset:0; background:#000; opacity:0; pointer-events:none; transition:opacity .6s; z-index:30}
  #fade.on{opacity:1}

  .spot{position:absolute; width:var(--spotW,16%); aspect-ratio:1; transform:translate(-50%,-50%); cursor:pointer; z-index:3}
  .spot .glow{position:absolute; inset:10%; border-radius:50%; background:radial-gradient(circle, rgba(255,255,220,.95) 0%, rgba(255,230,120,.7) 25%, rgba(255,210,80,0) 70%);
    mix-blend-mode:screen; animation:breathe 1.8s infinite}
  .spot .peek{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'Secular One'; font-size:var(--peek,60px);
    color:var(--c); -webkit-text-stroke:3px #fff; paint-order:stroke fill; opacity:0; transition:opacity .5s; filter:drop-shadow(0 0 10px #fff3b0)}
  .spot.hint .peek{opacity:.75; animation:bob 1s infinite}
  .spot.hint .glow{animation:breathe .8s infinite}
  .spot.done{pointer-events:none}
  /* 23/11: visible on bright backgrounds too (the mountain): dark halo + pulsing rings + a twinkling star */
  .spot::before{content:''; position:absolute; inset:12%; border-radius:50%; pointer-events:none;
    background:radial-gradient(circle, rgba(20,26,46,.42) 0%, rgba(20,26,46,.26) 42%, rgba(20,26,46,0) 70%)}
  .spot .ring{position:absolute; inset:24%; border-radius:50%; pointer-events:none; border:calc(var(--spotW,80px)*.028) solid #fff;
    box-shadow:0 0 0 calc(var(--spotW,80px)*.012) rgba(20,26,46,.6), 0 0 calc(var(--spotW,80px)*.12) calc(var(--spotW,80px)*.035) #ffd23f, inset 0 0 calc(var(--spotW,80px)*.08) #ffd23f;
    animation:ping 1.7s infinite ease-out}
  .spot .ring.r2{animation-delay:.85s}
  .spot .star{position:absolute; inset:31%; background:#fff; pointer-events:none;
    clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);
    filter:drop-shadow(0 0 2px #141a2e) drop-shadow(0 0 3px #141a2e) drop-shadow(0 0 9px #ffd23f); animation:twinkle 1.3s infinite ease-in-out}
  .spot.hint .ring{animation-duration:.95s; border-color:#ffd23f}
  .spot.hint .star{animation-duration:.7s}
  .spot.hint::after{content:'👆'; position:absolute; left:50%; top:74%; font-size:calc(var(--spotW,80px)*.4); line-height:1; pointer-events:none;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.6)); animation:pointUp .7s infinite ease-in-out}
  .spot.done .glow, .spot.done .fly, .spot.done .ring, .spot.done .star{display:none}
  .spot.done::before, .spot.done::after{display:none}
  .fly{position:absolute; width:7%; height:7%; border-radius:50%; background:#fff6b8; box-shadow:0 0 10px 5px #ffe066; pointer-events:none; animation:firefly 3s infinite ease-in-out}

  /* the letter rising out of its hiding place */
  #riser{position:absolute; z-index:6; font-family:'Secular One'; line-height:1; color:var(--c); -webkit-text-stroke:5px #fff; paint-order:stroke fill;
    filter:drop-shadow(0 0 18px #fff3b0) drop-shadow(0 6px 0 rgba(0,0,0,.25)); transform:translate(-50%,-50%) scale(.2); opacity:0; pointer-events:none}
  #riser.up{transition:transform .9s cubic-bezier(.2,1.5,.4,1), opacity .3s; transform:translate(-50%,-90%) scale(1); opacity:1}

  /* Shaul */
  #shaul{position:absolute; z-index:5; transform:translateX(-50%); pointer-events:none; direction:ltr}   /* ltr: the walk strip must start at the box's left edge */
  #shaul .stand{height:100%; display:block; transform:scaleX(var(--face,-1)); filter:drop-shadow(0 8px 6px rgba(0,0,0,.35))}
  #shaul .body{height:100%}
  /* walking: 12-frame sprite strip (img/shaul-walk.png, 305x400 per frame, faces right; see anim/walk.json) */
  #shaul .walkBox{display:none; height:100%; aspect-ratio:305/400; overflow:hidden; transform:scaleX(var(--face,-1)); filter:drop-shadow(0 8px 6px rgba(0,0,0,.35))}
  #shaul .walkBox img{height:100%; width:auto; max-width:none; display:block; animation:walkCycle 1s steps(12) infinite}
  #shaul.walk .stand{display:none}
  #shaul.walk .walkBox{display:block}
  @keyframes walkCycle{to{transform:translateX(-100%)}}
  #shaul.happy .body{animation:hop .45s 3}
  #shaul .shadow{position:absolute; bottom:-3%; left:18%; right:18%; height:7%; background:rgba(0,0,0,.35); border-radius:50%; filter:blur(3px); z-index:-1}

  /* go-on arrow (Hebrew direction = left) */
  #nextBtn{position:absolute; left:max(14px,env(safe-area-inset-left)); top:50%; z-index:22; display:none; border:none; cursor:pointer;
    width:min(20vh,120px); height:min(20vh,120px); border-radius:50%; background:radial-gradient(circle,#fff7c2,#ffd23f 70%);
    box-shadow:0 0 30px 10px rgba(255,214,80,.7), 0 8px 0 #c48a00; font-size:min(12vh,70px); color:#7a4a00; transform:translateY(-50%); animation:nudge 1s infinite}
  #nextBtn.show{display:block}

  /* ---------- HUD ---------- */
  #hud{position:absolute; top:max(10px,env(safe-area-inset-top)); left:0; right:0; display:flex; justify-content:center; gap:min(1.6vh,10px); z-index:20; pointer-events:none}
  .slot{width:min(12vh,68px,11vw); height:min(12vh,68px,11vw); border-radius:16px; background:rgba(255,255,255,.25); border:3px dashed rgba(255,255,255,.85);
    display:flex; align-items:center; justify-content:center; font-family:'Secular One'; font-size:min(8vh,44px,7.5vw); color:transparent; transition:all .5s; backdrop-filter:blur(2px)}
  .slot.got{background:#fffaf0; border:3px solid var(--gold); color:var(--c); transform:scale(1.1); box-shadow:0 0 16px rgba(255,214,80,.9)}
  .roundBtn{position:absolute; z-index:25; width:min(12vh,64px,12vw); height:min(12vh,64px,12vw); border-radius:50%; border:none;
    background:rgba(255,255,255,.92); box-shadow:0 4px 0 #c9a227, 0 6px 14px rgba(0,0,0,.3); font-size:min(6vh,30px,6vw); cursor:pointer}
  .roundBtn:active{transform:translateY(3px); box-shadow:0 1px 0 #c9a227}
  #soundBtn{top:max(10px,env(safe-area-inset-top)); left:12px}
  #homeBtn{top:max(10px,env(safe-area-inset-top)); right:12px}
  /* 21/11 the user: the YouTube link must be on screen during the whole game, not only at the start and the end.
     A round button under 🏠, above the found card / quiz too; hidden on the start and end screens (they have the big one). */
  #ytMini{top:calc(max(10px,env(safe-area-inset-top)) + min(12vh,64px,12vw) + 12px); right:12px; z-index:45; display:flex; align-items:center; justify-content:center; text-decoration:none}
  #ytMini i{display:block; width:56%; height:40%; border-radius:22%/30%; background:#e62117; position:relative}
  #ytMini i::after{content:''; position:absolute; left:50%; top:50%; transform:translate(-35%,-50%); border-style:solid; border-width:.28em 0 .28em .46em; border-color:transparent transparent transparent #fff}
  #game:has(#start.show) #ytMini, #game:has(#celebrate.show) #ytMini{display:none}
  /* 21/11 background music (forest only for now): 🎵 under 🔊 turns ONLY the music off/on */
  #musicBtn{top:calc(max(10px,env(safe-area-inset-top)) + min(12vh,64px,12vw) + 12px); left:12px; z-index:45}
  #musicBtn.off{opacity:.55; background:rgba(255,255,255,.92) linear-gradient(135deg,transparent 46%,#d33 46%,#d33 54%,transparent 54%)}
  #game:has(#start.show) #musicBtn, #game:has(#celebrate.show) #musicBtn{display:none}

  /* ---------- overlays ---------- */
  .overlay{position:absolute; inset:0; z-index:40; display:none; align-items:center; justify-content:center; flex-direction:column}
  .overlay.show{display:flex}
  .bgPic{position:absolute; inset:0; background-size:cover; background-position:center; z-index:-1}

  /* rainbow title on a wooden plank (channel signature) */
  .plank{background:linear-gradient(180deg,#a0673a,#7b4a26); border-radius:18px; padding:1vh 4vh 1.4vh; box-shadow:0 8px 0 #5a3519, 0 14px 30px rgba(0,0,0,.4);
    border:3px solid #c08552; display:flex; gap:.15em; font-family:'Secular One'; font-size:min(10vh,62px,9vw); line-height:1.15}
  .plank span{-webkit-text-stroke:2px #fff; paint-order:stroke fill; text-shadow:0 4px 0 rgba(0,0,0,.25)}
  .subPlank{margin-top:1.6vh; font-family:'Secular One'; font-size:min(5.5vh,30px,6vw); color:#fff; text-shadow:0 2px 0 #7b4a26, 0 0 12px rgba(0,0,0,.6)}

  #start .shaulBig{position:absolute; bottom:4%; right:8%; height:min(46vh,340px); filter:drop-shadow(0 10px 12px rgba(0,0,0,.4)); transform:scaleX(-1)}
  #start .startBg{background-position:62% center}
  #start .startShade{position:absolute; inset:0; z-index:-1; pointer-events:none;
    background:radial-gradient(ellipse at 50% 38%, rgba(20,12,0,.45), rgba(20,12,0,.15) 45%, rgba(0,0,0,0) 70%)}
  .teaser{display:flex; gap:min(2vh,12px); margin-top:2.4vh}
  .teaser span{width:min(9vh,54px,13vw); aspect-ratio:1; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.95), rgba(255,250,235,.85)); box-shadow:0 0 0 3px rgba(255,214,80,.9), 0 0 18px rgba(255,214,80,.75);
    font-family:'Secular One'; font-size:min(6vh,36px,8.5vw); line-height:1; color:var(--c); animation:bob 2s infinite}
  .teaser span:nth-child(2){animation-delay:.25s} .teaser span:nth-child(3){animation-delay:.5s}
  .teaser span:nth-child(4){animation-delay:.75s} .teaser span:nth-child(5){animation-delay:1s}
  .playBtn{margin-top:3vh; width:min(22vh,130px); height:min(22vh,130px); border-radius:50%; border:none; background:radial-gradient(circle at 40% 35%,#fff3a0,#ffc61a 60%,#f0a000);
    box-shadow:0 8px 0 #b37400, 0 0 40px rgba(255,214,80,.8); font-size:min(10vh,58px); color:#fff; cursor:pointer; animation:pulse 1.4s infinite; text-shadow:0 2px 0 #b37400}
  .playBtn:active{transform:translateY(6px); box-shadow:0 2px 0 #b37400}

  /* world (stage) picker on the start screen, and the "next stage" button at the end (20/11, farm = world 2) */
  #worlds{display:flex; gap:min(3vh,18px); margin-top:3vh; z-index:2}
  .worldBtn{position:relative; width:min(30vh,200px,40vw); aspect-ratio:4/3; border-radius:24px; border:4px solid #fff; cursor:pointer; padding:0;
    background-size:cover; box-shadow:0 7px 0 #c9a227, 0 0 28px rgba(255,214,80,.7)}
  .worldBtn:active{transform:translateY(5px); box-shadow:0 2px 0 #c9a227}
  .worldBtn i{position:absolute; left:50%; top:37%; transform:translate(-50%,-50%); width:34%; aspect-ratio:1; border-radius:50%; font-style:normal;
    display:flex; align-items:center; justify-content:center; font-size:min(7vh,40px,8vw); color:#fff; text-shadow:0 2px 0 #b37400;
    background:radial-gradient(circle at 40% 35%,#fff3a0,#ffc61a 60%,#f0a000); box-shadow:0 5px 0 #b37400; animation:pulse 1.4s infinite}
  .worldBtn .wl{position:absolute; left:6%; right:6%; bottom:6%; border-radius:12px; background:rgba(255,250,240,.93); font-family:'Secular One';
    font-size:min(4.4vh,26px,5.6vw); letter-spacing:.12em; line-height:1.3; color:var(--ink)}
  .celebBtns{display:flex; align-items:center; gap:min(4vh,24px); margin-top:3vh}
  .celebBtns .playBtn{margin-top:0}
  #nextWorldBtn{display:none; width:min(26vh,170px,38vw)}
  #nextWorldBtn.show{display:block; animation:pulse 1.4s infinite}
  #endHomeBtn{display:none} #endHomeBtn.show{display:block}
  /* 21/11 the user: on a COMPUTER the two end-screen buttons sat in the middle, one under the other, touching. There (mouse + wide screen)
     they go to the bottom corners: YouTube on the left, WhatsApp on the right. Phones and tablets keep the stacked layout. */
  @media (orientation:landscape) and (hover:hover) and (pointer:fine){
    #celebrate a.ytBtn{position:absolute; margin:0; font-size:min(4.6vh,22px); bottom:max(18px,env(safe-area-inset-bottom)); left:max(20px,env(safe-area-inset-left)); right:auto}
    #celebrate a.ytBtn.waBtn{left:auto; right:max(20px,env(safe-area-inset-right))}
  }

  /* link to the Shaul YouTube channel (20/11, top priority: the game funnels to the channel). Small on the start screen, big at the end */
  .ytBtn{display:inline-flex; align-items:center; gap:.5em; text-decoration:none; background:#fff; color:#2b2b2b; border-radius:999px;
    font-family:'Secular One'; font-size:min(3.6vh,20px,4.6vw); padding:.45em 1em .45em .8em; box-shadow:0 4px 0 #c9a227, 0 8px 18px rgba(0,0,0,.35); white-space:nowrap}
  .ytBtn:active{transform:translateY(3px); box-shadow:0 1px 0 #c9a227}
  .ytBtn i{display:inline-block; width:1.6em; height:1.15em; border-radius:.32em; background:#e62117; position:relative; flex:none}
  .ytBtn i::after{content:''; position:absolute; left:50%; top:50%; transform:translate(-35%,-50%); border-style:solid; border-width:.3em 0 .3em .5em;
    border-color:transparent transparent transparent #fff}
  #start .ytBtn{position:absolute; bottom:max(16px,env(safe-area-inset-bottom)); left:max(16px,env(safe-area-inset-left))}
  /* 21/11 the user: copyright notice (free; LICENSE file in the repo says all rights reserved) */
  .copyNote{position:absolute; top:max(8px,env(safe-area-inset-top)); left:50%; transform:translateX(-50%); font-family:system-ui,sans-serif; font-size:min(1.9vh,12px,3vw);
    color:rgba(255,255,255,.85); text-shadow:0 1px 3px rgba(0,0,0,.8); white-space:nowrap; pointer-events:none}
  /* 21/11 the user: a WhatsApp button so anyone can share the game (wa.me link, text + site URL set in game.js) */
  .ytBtn i.wa, .roundBtn i.wa{background:#25d366; border-radius:50%; width:1.25em; height:1.25em}
  .ytBtn i.wa::after, .roundBtn i.wa::after{content:'✆'; border:0; color:#fff; font-size:.85em; line-height:1; transform:translate(-50%,-52%); font-family:system-ui,sans-serif}
  #start .waBtn{bottom:calc(max(16px,env(safe-area-inset-bottom)) + 3.1em)}
  #celebrate .waBtn{margin-top:1.4vh}
  @media (orientation:landscape){ #celebrate .waBtn{left:auto; right:max(16px,env(safe-area-inset-right))} }
  #waMini{top:calc(max(10px,env(safe-area-inset-top)) + 2*min(12vh,64px,12vw) + 24px); right:12px; z-index:45; display:flex; align-items:center; justify-content:center; text-decoration:none}
  #waMini i.wa{width:60%; height:60%; position:relative; display:block}
  #waMini i.wa::after{position:absolute; left:50%; top:50%; font-size:min(3.6vh,19px,3.6vw)}
  #game:has(#start.show) #waMini, #game:has(#celebrate.show) #waMini{display:none}
  #celebrate .ytBtn{margin-top:2.4vh; font-size:min(4.6vh,26px,5.4vw)}
  @media (orientation:landscape){ #celebrate .ytBtn{position:absolute; margin:0; font-size:min(4.6vh,22px);
    bottom:max(14px,env(safe-area-inset-bottom)); left:max(16px,env(safe-area-inset-left))} }

  /* letter card */
  #found{background:rgba(10,20,35,.45); backdrop-filter:blur(4px)}
  .card{background:#fffaf0; border-radius:34px; padding:2.6vh; box-shadow:0 0 0 6px var(--gold), 0 18px 50px rgba(0,0,0,.45);
    display:flex; align-items:center; gap:3vh; animation:pop .55s cubic-bezier(.2,1.6,.4,1)}
  .bigLetter{font-family:'Secular One'; font-size:min(42vh,250px); line-height:.95; color:var(--c); -webkit-text-stroke:6px #fff; paint-order:stroke fill;
    filter:drop-shadow(0 6px 0 rgba(0,0,0,.18)); padding:0 2vh}
  .wordBox{display:flex; flex-direction:column; align-items:center; gap:1.2vh}
  .wordPic{width:min(44vh,250px); aspect-ratio:1; border-radius:26px; overflow:hidden; box-shadow:0 6px 18px rgba(0,0,0,.25)}
  .wordPic img{width:100%; height:100%; object-fit:cover; display:block}
  .wordTxt{font-family:'Secular One'; font-size:min(9vh,50px)}
  .wordTxt b{color:var(--c)}

  /* 24/11 cursive mode ("כתב"): body.ktav swaps the letter font; the card shows the print letter beside the cursive one */
  .modeSwitch{display:flex; gap:6px; margin-top:1.6vh; background:rgba(255,255,255,.93); border-radius:999px; padding:5px;
    box-shadow:0 4px 0 #c9a227, 0 8px 18px rgba(0,0,0,.35); z-index:2}
  .modeSwitch button{border:none; background:transparent; border-radius:999px; padding:.18em .9em; font-family:'Secular One'; font-size:min(3.8vh,21px,4.8vw);
    color:#2b2b2b; cursor:pointer; display:flex; align-items:center; gap:.45em; line-height:1.2}
  .modeSwitch button b{font-weight:400; font-size:1.3em; line-height:1; color:#4361ee}
  .modeSwitch button[data-m=ktav] b{font-family:'Gveret Levin','Secular One'; font-size:1.65em}
  .modeSwitch button.on{background:#ffd23f; box-shadow:0 3px 0 #c9a227}
  body.ktav .spot .peek, body.ktav #riser, body.ktav .slot, body.ktav .bigLetter, body.ktav .choice, body.ktav .wordTxt, body.ktav #celebRow{font-family:'Gveret Levin','Secular One'}
  body.ktav .wordTxt{font-size:min(11vh,62px)}
  body.ktav .bigLetter::after{content:attr(data-print); font-family:'Secular One'; font-size:.3em; -webkit-text-stroke:3px #fff; opacity:.8; margin-inline-start:.1em; vertical-align:top}

  /* quiz */
  #quiz .bgPic{filter:blur(6px) brightness(.75); transform:scale(1.08)}
  /* 24/11 the user: Shaul's face + a "?" bubble instead of the ear emoji (looked different on every phone, unclear to a 4-year-old) */
  #quiz .ear{position:relative; border:none; padding:0; background:#bfe9ff; border-radius:50%; width:min(23vh,132px); height:min(23vh,132px);
    box-shadow:0 6px 0 #c9a227, 0 0 0 4px #fff, 0 0 30px rgba(255,214,80,.6); cursor:pointer; margin-bottom:3vh; animation:pulse 1.4s infinite}
  #quiz .ear .face{position:absolute; inset:0; border-radius:50%; overflow:hidden; pointer-events:none}
  #quiz .ear .face img{position:absolute; width:150%; left:-22%; top:-4%}
  #quiz .ear .q{position:absolute; top:-8%; left:-10%; width:42%; height:42%; border-radius:50%; background:#ffd23f; border:3px solid #22264a;
    display:grid; place-items:center; font:900 min(7vh,40px)/1 'Secular One',sans-serif; color:#22264a; pointer-events:none}
  #choices{display:flex; gap:4vh}
  .choice{width:min(32vh,190px); aspect-ratio:1; border-radius:34px; border:none; background:#fffaf0; cursor:pointer;
    box-shadow:0 8px 0 #c9a227, 0 14px 28px rgba(0,0,0,.35); font-family:'Secular One'; font-size:min(24vh,140px); line-height:1; color:var(--c);
    -webkit-text-stroke:4px #fff; paint-order:stroke fill; transition:transform .2s, opacity .4s}
  .choice:active{transform:translateY(6px)}
  .choice.no{animation:shake .5s; opacity:.3}
  .choice.yes{background:#fff3a6; transform:scale(1.14); box-shadow:0 0 0 6px var(--gold), 0 0 40px rgba(255,214,80,.9)}
  #stars{position:absolute; top:max(14px,env(safe-area-inset-top)); display:flex; gap:8px; font-size:min(8vh,40px)}
  #stars span{filter:grayscale(1) brightness(1.6); opacity:.45; transition:all .4s}
  #stars span.on{filter:none; opacity:1; transform:scale(1.25)}

  /* celebrate */
  #celebrate .bgPic{filter:brightness(.95)}
  #celebrate .friends{height:min(50vh,400px); margin-top:1vh; max-width:94vw; object-fit:contain; animation:hop 1.1s infinite; filter:drop-shadow(0 12px 14px rgba(0,0,0,.4))}
  .confetti{position:absolute; top:-20px; width:12px; height:18px; border-radius:3px; animation:fall linear forwards; pointer-events:none}
  /* 21/11 the user: realistic soap bubbles instead of confetti at the end of each world (tap = pop into droplets, no new sound).
     Almost transparent; the colour is a thin swirling thin-film rim + two light reflections; the film wobbles as it floats. */
  #bubbles{position:absolute; inset:0; overflow:hidden; z-index:1; pointer-events:none}
  #celebrate .celebBtns, #celebrate .ytBtn, #celebrate .plank{position:relative; z-index:2}
  /* 21/11 reward clip: a card under the letters; in landscape it first fills the screen (.vidFull) */
  #celebrate .friends[hidden], #celebrate .rewardCard[hidden]{display:none}
  #celebrate .rewardCard{position:relative; z-index:2; width:min(92vw,62vh*16/9,900px); aspect-ratio:16/9; max-width:100%; border-radius:22px; overflow:hidden;
    border:5px solid #fff; box-shadow:0 14px 30px rgba(0,0,0,.45), 0 0 0 3px rgba(255,210,63,.8); background:#000; margin-top:1.5vh}
  #celebrate .rewardCard.pop{animation:cardIn .5s cubic-bezier(.2,1.4,.4,1) both}
  #celebrate .rewardCard video{width:100%; height:100%; object-fit:cover; display:block}
  @keyframes cardIn{from{transform:scale(.6); opacity:0}}
  #celebrate.vidFull .rewardCard{position:fixed; inset:0; width:100vw; height:100vh; height:100dvh; max-width:none; margin:0; border:0; border-radius:0; box-shadow:none; z-index:20}
  #celebrate.vidFull .rewardCard video{object-fit:contain}
